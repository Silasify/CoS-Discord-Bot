<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="46%" r="65%">
      <stop offset="0" stop-color="#f6b44a"/>
      <stop offset="0.35" stop-color="#d9702a"/>
      <stop offset="0.75" stop-color="#6b2a1a"/>
      <stop offset="1" stop-color="#1b0d0a"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3c9"/>
      <stop offset="0.6" stop-color="#ffd37a"/>
      <stop offset="1" stop-color="#f2a33a"/>
    </radialGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a3a1c"/><stop offset="1" stop-color="#3a1710"/>
    </linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1e12"/><stop offset="1" stop-color="#150907"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe29a"/><stop offset="0.5" stop-color="#d9a441"/><stop offset="1" stop-color="#8a5f1c"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="512" cy="512" r="470"/></clipPath>
    <path id="arc" d="M 162 512 A 350 350 0 0 0 862 512"/>
  </defs>

  
  <g clip-path="url(#disc)">
    <rect width="1024" height="1024" fill="url(#sky)"/>
    <!-- sun rays -->
    <g stroke="#ffd37a" stroke-opacity="0.18" stroke-width="10">
      <path d="M512 400 L512 -50"/><path d="M512 400 L200 -50"/><path d="M512 400 L824 -50"/>
      <path d="M512 400 L-50 120"/><path d="M512 400 L1074 120"/>
    </g>
    <circle cx="512" cy="400" r="150" fill="url(#sun)"/>
    <circle cx="512" cy="400" r="150" fill="none" stroke="#fff3c9" stroke-opacity="0.5" stroke-width="4"/>
    <!-- dunes -->
    <path d="M0 600 C180 520 300 560 430 590 C560 620 700 520 1024 580 L1024 1024 L0 1024Z" fill="url(#d1)"/>
    <path d="M0 700 C150 640 320 700 480 680 C660 650 820 610 1024 690 L1024 1024 L0 1024Z" fill="url(#d2)"/>
    <path d="M430 590 C470 600 520 640 560 700" stroke="#ffb35a" stroke-opacity="0.5" stroke-width="5" fill="none"/>
    <path d="M0 820 C200 760 420 830 620 800 C800 775 920 790 1024 810 L1024 1024 L0 1024Z" fill="#0c0504"/>
    <!-- cloaked figure on ridge -->
    <g transform="translate(640 560)" fill="#0c0504">
      <path d="M-34 70 C-30 30 -24 -10 -10 -34 C-8 -52 8 -52 10 -34 C24 -10 30 30 34 70Z"/>
    </g>
    <!-- small second and third figures (children) -->
    <g fill="#0c0504">
      <path d="M-14 36 C-12 12 -8 -8 0 -18 C8 -8 12 12 14 36Z" transform="translate(588 584)"/>
      <path d="M-11 30 C-10 10 -6 -6 0 -14 C6 -6 10 10 11 30Z" transform="translate(556 600)"/>
    </g>
  </g>

  <!-- rings -->
  <circle cx="512" cy="512" r="470" fill="none" stroke="url(#gold)" stroke-width="14"/>
  <circle cx="512" cy="512" r="446" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.8"/>

  <!-- title -->
  <path d="M170 700 Q512 800 854 700 L854 880 Q512 960 170 880Z" fill="#0c0504" fill-opacity="0.0"/>
  <g font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" fill="url(#gold)" text-anchor="middle">
    <text font-size="50" letter-spacing="7">
      <textPath href="#arc" startOffset="50%" transform="translate(0 0)">CHILDREN OF SALUSA</textPath>
    </text>
  </g>
</svg>
